[package]
name = "pprof-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VGI worker that decodes pprof (profile.proto) profiles into SQL rows for bulk profile diffing in DuckDB over Apache Arrow"

[lib]
name = "pprof_worker"
path = "src/lib.rs"

[[bin]]
name = "pprof-worker"
path = "src/main.rs"

[dependencies]
pprof-core = { path = "../pprof-core" }
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
glob = "0.3"
log = "0.4"

# --- Native ---------------------------------------------------------------
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# HTTP transport only. The SDK's `sqlite` feature (a SQLite-backed buffering /
# function-state store) is deliberately off: this worker never touches the
# function store, and the feature bundles C SQLite via rusqlite 0.39 ->
# libsqlite3-sys 0.37 (RUSTSEC-2026-0459). Without it the SDK falls back to its
# file-system store (`VGI_WORKER_SHARED_STORAGE` unset -> fs).
vgi = { workspace = true, features = ["transport-http"] }
vgi-rpc = { workspace = true, features = ["http"] }
env_logger = "0.11"

# --- wasm32 ---------------------------------------------------------------
[target.'cfg(target_arch = "wasm32")'.dependencies]
# No sqlite (C) and no HTTP transport (tokio/mio/axum); the bincode stream codec
# is what the SAB byte-channel transport needs.
vgi = { workspace = true }
vgi-rpc = { workspace = true, features = ["stream-codec"] }
