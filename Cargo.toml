[workspace]
resolver = "2"
members = ["crates/pprof-core", "crates/pprof-worker", "crates/pprof-wasm"]
# pprof-wasm only makes sense for wasm32-unknown-emscripten (it is a staticlib
# whose ring ops are supplied by emcc's --js-library), so keep it out of the
# default set: bare `cargo build` / `test` / `clippy` stay native-only and
# unchanged. Build it explicitly with `wasm/build.sh` or `-p pprof-wasm`.
default-members = ["crates/pprof-core", "crates/pprof-worker"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Query Farm LLC <hello@query.farm>"]
repository = "https://github.com/Query-farm/vgi-pprof"

[workspace.dependencies]
# VGI Rust SDK (worker side), published on crates.io. Pulls in vgi-rpc 0.11 and
# arrow 59 transitively; keep arrow/vgi-rpc here in lockstep with vgi's pins so a
# single arrow/vgi-rpc resolves.
vgi = { version = "0.25", default-features = false }
vgi-rpc = { version = "0.16", default-features = false, features = ["macros"] }
arrow-array = "59"
arrow-buffer = "59"
arrow-schema = "59"
# pprof decode stack: prost (proto runtime) + prost-build (codegen from the
# vendored profile.proto), flate2 for the on-disk gzip wrapper.
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
flate2 = "1"

[profile.release]
opt-level = 2
# Strip symbols + debug info from the release binary in production builds; build
# a debug profile locally if you need in-binary backtraces.
strip = true
