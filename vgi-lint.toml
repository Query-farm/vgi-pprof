# vgi-lint-check configuration for the vgi-pprof worker.
#
# No rule is suppressed. Every example query and vgi.executable_examples entry
# decodes an inline BLOB literal (a base64 copy of a committed data/ fixture), so
# the example-EXECUTION rules (VGI901/902/906/907/913) and the scan-responds rule
# (VGI911) materialize rows with no network and no files — for any user, from any
# directory, not just the repo root (VGI516). The same
# example queries are ALSO executed for real against the committed on-disk
# fixtures by the haybarn SQLLogic E2E (test/sql/*.test) on every transport.
#
# fail_on = "info" is STRICTER than the default gate and is intentional: the
# worker must be clean down to info severity.
[tool.vgi-lint-check]
select = ["ALL"]
fail_on = "info"

